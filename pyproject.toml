[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "recharness"
version = "0.3.0"
description = "A bandit-routed agentic harness for self-evolving recommender systems"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{name = "Anonymous Authors"}]
keywords = ["llm", "agent", "code-evolution", "recommendation-system", "bandit-routing", "thompson-sampling", "automl"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["jsonschema>=4.20"]

[project.scripts]
recharness = "recharness.cli:main"

[project.optional-dependencies]
legacy = ["deepagents>=0.1", "langchain>=0.3", "langchain-anthropic>=0.3", "langchain-openai>=0.3", "langgraph>=0.2", "langgraph-checkpoint-sqlite>=2.0"]
sandbox  = ["langchain-modal>=0.1", "modal>=0.60"]
dev      = ["pytest>=8", "numpy>=1.26", "pandas>=2.0", "scikit-learn>=1.3", "tqdm>=4.66"]
# Required to actually run the cold-start templates on GPU
templates = ["torch>=2.2", "numpy>=1.26", "pandas>=2.0", "scikit-learn>=1.3", "tqdm>=4.66"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["gagc*", "recharness*"]
exclude = ["logs*", "input*", "results*", "workspace*", "examples*", "scripts*", "tests*"]
